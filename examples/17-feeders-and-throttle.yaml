# CSV/JSON feeders with a gRPC request-rate ceiling.
name: grpc-feeders-and-throttle

data:
  users:
    type: csv
    path: data/users.csv
    mode: per_vu
    pick: shuffle
    on_eof: recycle
  skus:
    type: json
    path: data/skus.json
    pick: random

scenarios:
  steady:
    executor: constant-vus
    vus: 50
    duration: 5m
    throttle: { requests_per_second: 200 }
    flow:
      - request:
          name: lookup
          url: grpc://greeter.example.com:50051
          grpc:
            proto_files: [protos/helloworld.proto]
            service: helloworld.Greeter
            method: SayHello
            message: { name: "${data.users.username}:${data.skus.sku}" }
          checks: [{ type: status, equals: 0 }]

thresholds:
  grpc_reqs: ["rate<=205"]
  grpc_req_duration: ["p(95)<400"]
