[workspace]
resolver = "2"
members = [
    "crates/loadr-core",
    "crates/loadr-config",
    "crates/loadr-grpc",
    "crates/loadr-prometheus",
    "crates/loadr-feeder-api",
    "crates/loadr-agent",
    "crates/loadr-webui",
    "crates/loadr-cli",
    "plugins/examples/signed-tx-feeder",
    "testsupport/loadr-testserver",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://loadr.io"
homepage = "https://loadr.io"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates carry an explicit version so they can be published to
# crates.io (path-only deps are rejected by the registry). loadr-testserver
# stays path-only — it is publish=false and used only as a dev-dependency.
loadr-core = { path = "crates/loadr-core", version = "1.0.0" }
loadr-config = { path = "crates/loadr-config", version = "1.0.0" }
loadr-grpc = { path = "crates/loadr-grpc", version = "1.0.0" }
loadr-prometheus = { path = "crates/loadr-prometheus", version = "1.0.0" }
loadr-feeder-api = { path = "crates/loadr-feeder-api", version = "1.0.0" }
loadr-agent = { path = "crates/loadr-agent", version = "1.0.0" }
loadr-webui = { path = "crates/loadr-webui", version = "1.0.0" }
loadr-testserver = { path = "testsupport/loadr-testserver" }

tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "1", features = ["indexmap2"] }
serde_json_path = "0.7"
jmespath = { version = "0.5", features = ["sync"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "webpki-roots", "http1", "tls12"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = "0.14"

tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
abi_stable = "0.11"
ed25519-dalek = "2"

axum = { version = "0.8", features = ["ws", "macros"] }
rust-embed = "8"

clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.18"

hdrhistogram = { version = "7", features = ["serialization"] }
csv = "1"
regex = "1"
url = "2"
cookie = "0.18"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
rand_distr = "0.6"
base64 = "0.22"
sha2 = "0.11"
sxd-document = "0.3"
sxd-xpath = "0.4"
scraper = "0.27"
humantime = "2"
toml = "0.8"
tempfile = "3"
pin-project-lite = "0.2"
serde_path_to_error = "0.1"
strsim = "0.11"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
